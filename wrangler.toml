# Cloudflare Pages configuration
# This file is optional but recommended for Pages projects

name = "trabalink"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Environment variables are set in Cloudflare Dashboard → Pages → Settings → Environment variables
# No need to put secrets here - use the dashboard instead

[build]
command = "npm run build"
destination = "dist"

# SPA routing handled by _redirects file in public/
# No additional config needed for client-side routing